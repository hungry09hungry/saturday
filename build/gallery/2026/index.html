  <dialog id="viewer">
    <img alt="">
    <p></p>
    <div id="closebtn">&#8855;</div>
  </dialog>

<script>
  const viewer = document.getElementById("viewer");
  const viewerImg = viewer.querySelector("img");
  const viewerDesc = viewer.querySelector("p");
  const closebtn = document.getElementById("closebtn");

  document.querySelectorAll(".photos a").forEach(a => {
    a.addEventListener("click", e => {
      e.preventDefault();

      const desc = a.dataset.desc;
      viewerImg.src = a.href;
      viewerImg.alt = desc || "";
      viewerDesc.textContent = desc || "";
      viewerDesc.hidden = !desc;

      viewer.showModal();
    });
  });

  closebtn.addEventListener("click", () => viewer.close());
</script>
